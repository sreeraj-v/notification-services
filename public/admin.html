<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Center - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="mb-8">
            <h1 class="text-2xl font-semibold tracking-tight text-gray-900">Send Notification</h1>
            <p class="text-sm text-gray-500 mt-2">Trigger a new alert to a specific user.</p>
        </div>

        <form id="notificationForm" class="space-y-5">
            <div>
                <label for="userId" class="block text-sm font-medium text-gray-700 mb-1">User ID</label>
                <input type="text" id="userId" name="userId" required
                    class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="e.g., testuser123">
            </div>

            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                <input type="text" id="title" name="title" required
                    class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="Notification Title">
            </div>

            <div>
                <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                <textarea id="message" name="message" rows="3" required
                    class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"
                    placeholder="Type the message here..."></textarea>
            </div>
            
            <div>
                <label for="scheduleAt" class="block text-sm font-medium text-gray-700 mb-1">Schedule At (Optional)</label>
                <input type="datetime-local" id="scheduleAt" name="scheduleAt"
                    class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-gray-600">
            </div>

            <button type="submit"
                class="w-full bg-black hover:bg-gray-800 text-white font-medium py-2.5 rounded-lg transition-colors mt-4 flex justify-center items-center gap-2">
                <span>Send Notification</span>
                <svg id="loadingSpinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <div id="statusMessage" class="mt-4 text-sm text-center hidden rounded-md py-2 px-3"></div>
    </div>

    <script>
        const form = document.getElementById('notificationForm');
        const statusMessage = document.getElementById('statusMessage');
        const spinner = document.getElementById('loadingSpinner');
        const submitBtn = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset status
            statusMessage.classList.add('hidden');
            statusMessage.className = 'mt-4 text-sm text-center hidden rounded-md py-2 px-3';
            
            // UI Loading state
            spinner.classList.remove('hidden');
            submitBtn.disabled = true;

            const userId = document.getElementById('userId').value;
            const title = document.getElementById('title').value;
            const message = document.getElementById('message').value;
            const scheduleAt = document.getElementById('scheduleAt').value;

            const payload = { userId, title, message };
            if (scheduleAt) {
                // Convert local datetime to UTC ISO string
                payload.scheduleAt = new Date(scheduleAt).toISOString();
            }

            try {
                const response = await fetch('/notifications', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                statusMessage.classList.remove('hidden');
                if (response.ok) {
                    statusMessage.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200');
                    statusMessage.textContent = 'Notification submitted successfully!';
                    form.reset();
                } else {
                    statusMessage.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
                    statusMessage.textContent = data.error || 'Failed to send notification.';
                }
            } catch (error) {
                statusMessage.classList.remove('hidden');
                statusMessage.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
                statusMessage.textContent = 'Network error occurred.';
            } finally {
                spinner.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
